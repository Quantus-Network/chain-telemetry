worker_processes  auto;
worker_rlimit_nofile  30000;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8000;
}

http {
    default_type  application/octet-stream;
    include       /etc/nginx/mime.types;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;

    keepalive_timeout  65;
    gzip  on;
    include /etc/nginx/conf.d/*.conf;

    server {
        root /app;
        index index.html;
        listen 8000;
        listen [::]:8000;

        # Favicons are cached very aggressively (including in private windows).
        location = /quantus-favicon.svg {
            expires off;
            add_header Cache-Control "no-cache, private, must-revalidate" always;
        }

        location = /favicon.svg {
            expires off;
            add_header Cache-Control "no-cache, private, must-revalidate" always;
        }

        # HTML shell: new deploys get new hashed JS/CSS filenames.
        location = /index.html {
            expires off;
            add_header Cache-Control "no-cache, private, must-revalidate" always;
        }
    }
}
