name: Publish images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FRONTEND_IMAGE: ghcr.io/quantus-network/chain-telemetry-frontend
  BACKEND_IMAGE: ghcr.io/quantus-network/chain-telemetry-backend

jobs:
  publish:
    name: Publish frontend and backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish backend
        id: backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}

      - name: Publish frontend
        id: frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}

      - name: Print digest pins
        run: |
          echo "telemetry_backend_tag=${GITHUB_REF_NAME}@${{ steps.backend.outputs.digest }}"
          echo "telemetry_frontend_tag=${GITHUB_REF_NAME}@${{ steps.frontend.outputs.digest }}"
